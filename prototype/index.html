<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>包租管理｜試用版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<!--
  PRM 包租管理系統：可操作原型（拋棄式，不是正式系統的程式碼）
  - 依據 docs/tech/04-ui-design.md（D-079、D-080）與 docs/specs/ 的規則；主色松綠
  - 全部假資料；操作只存在各自瀏覽器（localStorage），可按「重設試用資料」回到初始狀態
  - 日期固定為 115/10/05（一），讓每個人看到同樣的待辦
-->
<style>
:root{color-scheme:light;
  --bg:#F7F3EC;--card:#FFFDF9;--side:#EFE8DD;--line:#E5DDD0;--line2:#EDE6DA;--line3:#F3EEE6;
  --text:#2F2A25;--text2:#6B6158;--text3:#8A7F74;--ink2:#4A423B;
  --accent:#3F6B5C;--accent-d:#2E5044;--accent-s:#E3ECE6;
  --red:#B3261E;--sev-red:#C8372D;--sev-amber:#E08A1E;--sev-green:#4C9A5E;--red-s:#FBE9E6;--amber:#8A5A00;--amber-s:#FBF0D9;--gray-s:#F0EBE3;
  --s-rent:#8B7F72;--s-list:#5E8FB3;--s-prep:#CDBB9E;--s-spec:#9C7AA0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--accent-d)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.serif{font-family:'Noto Serif TC',serif}
.muted{color:var(--text2)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p{margin:0}

/* 試用版提示列 */
.banner{position:sticky;top:0;z-index:40;background:var(--amber-s);color:#6B4500;font-size:13px;padding:6px 16px;display:flex;gap:10px 14px;align-items:center;justify-content:center;flex-wrap:wrap;border-bottom:1px solid #EFDDB6}
.banner b{font-weight:700}
.banner button{height:30px;padding:0 10px;border-radius:8px;border:1px solid #C9A462;background:#FFFDF9;color:#6B4500;font-size:13px;cursor:pointer}

.shell{display:flex;align-items:flex-start}
.side{width:232px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:43px;height:calc(100vh - 43px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.brand b{font-family:'Noto Serif TC',serif;font-size:19px;letter-spacing:1px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;text-decoration:none;color:var(--ink2);font-size:15px}
.nav a:hover{background:#E8E0D3}
.nav a[aria-current=page]{background:var(--accent-s);color:var(--accent-d);font-weight:700}
.side-foot{margin-top:auto;border-top:1px solid #E0D6C8;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.role{display:flex;flex-direction:column;gap:6px;padding:0 8px;font-size:13px;color:var(--text2)}
.role select{height:40px;border-radius:10px;border:1px solid #DCD2C3;background:var(--card);padding:0 10px;font-size:15px}

main{flex:1;min-width:0;padding:32px 40px 64px;max-width:1260px}
.tabbar{display:none}

/* 頁首 */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}
.phead h1{font-size:30px;font-weight:700}
.phead p{margin-top:6px;font-size:15px}
.phead-r{display:flex;align-items:center;gap:12px}
.backlink{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:15px;margin-bottom:10px;min-height:32px}

/* 搜尋 */
.sbox{position:relative;width:440px}
.sbox>svg{position:absolute;left:15px;top:14px;color:var(--text3);pointer-events:none}
.sbox input{width:100%;height:48px;padding:0 16px 0 46px;border-radius:12px;border:1px solid #DCD2C3;background:var(--card);font-size:15px}
.sbox input:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.sdrop{position:absolute;top:54px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(60,40,20,.12);z-index:20;max-height:420px;overflow:auto;padding:6px}
.sres{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;text-decoration:none;color:var(--text);min-height:44px}
.sres:hover,.sres:focus{background:var(--gray-s)}
.sres .lmain{min-width:0}
.sres .lmain small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snone{padding:12px;color:var(--text2);font-size:14px}
/* 首頁大搜尋欄（單元管理主要入口） */
.hsearch{gap:10px}
.hsearch h2{font-size:21px;font-weight:700}
.hsearch .sbox{width:100%;max-width:760px}
.hsearch .sbox>svg{left:18px;top:17px}
.hsearch .sbox input{height:56px;padding-left:52px;font-size:17px;border-color:var(--accent);box-shadow:0 1px 3px rgba(63,107,92,.12)}
.hsearch .sdrop{top:62px}

/* 區塊與卡片 */
.sec{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:21px;font-weight:700}
.legend{display:flex;gap:16px;font-size:13px;color:var(--text2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:5px;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(80,60,40,.05)}
.pad{padding:20px 22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.acard{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.acard-h{display:flex;align-items:center;gap:10px}
.acard-h h3{font-size:16px;font-weight:500;flex:1}
.acount{display:flex;align-items:baseline;gap:6px}
.acount b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.acount span{color:var(--text2);font-size:15px}
.adetail{font-size:14px;color:var(--ink2);line-height:1.6}
.more{font-size:14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:32px}
.badge{border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.b-red{background:var(--red-s);color:var(--red)}
.b-amber{background:var(--amber-s);color:var(--amber)}
.b-gray{background:var(--gray-s);color:var(--text2)}
/* 待辦卡片優先度＝外框顏色（D-160）：紅＝高優先、橙＝中優先、綠＝持續追蹤 */
.sev-red{border:2px solid var(--sev-red)}.sev-amber{border:2px solid var(--sev-amber)}.sev-gray{border:2px solid var(--sev-green)}
.sevlist{display:flex;flex-direction:column;gap:8px}
.sevlist .lrow{background:var(--card);border-radius:12px}
.sevlist .lrow.sev-red{border:2px solid var(--sev-red)}.sevlist .lrow.sev-amber{border:2px solid var(--sev-amber)}.sevlist .lrow.sev-gray{border:2px solid var(--sev-green)}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--accent-s);color:var(--accent-d);white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--text2);background:var(--card);border:1px dashed var(--line);border-radius:14px}

/* 例行作業 */
.task-h{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.task-h h2{font-size:21px;font-weight:700}
.bar{width:160px;height:8px;border-radius:4px;background:var(--line2);overflow:hidden;display:flex}
.bar span{background:var(--accent)}
.tasks{gap:10px 24px}
.task{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}
.task input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0}
.task span{display:flex;flex-direction:column}
.task b{font-weight:400;font-size:15px}
.task small{font-size:13px;color:var(--text2)}

/* 狀態標籤 */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:8px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:4px;display:inline-block}
.c-rent{background:#ECE7E1;color:#574D43}.c-rent i{background:var(--s-rent)}
.c-list{background:#E6EEF4;color:#3B5A70}.c-list i{background:var(--s-list)}
.c-prep{background:#F3EDE3;color:#574D43}.c-prep i{background:var(--s-prep)}
.c-spec{background:#F1EAF1;color:#5E4462}.c-spec i{background:var(--s-spec)}
.pill{font-size:13px;padding:3px 9px;border-radius:7px;white-space:nowrap;display:inline-block}
.p-red{background:var(--red-s);color:var(--red)}
.p-amber{background:var(--amber-s);color:var(--amber)}
.p-gray{background:var(--gray-s);color:var(--text2)}
.p-ok{background:var(--accent-s);color:var(--accent-d)}
.p-green{background:#E5F2E8;color:#2F6E3E}   /* 待辦「持續追蹤」級，與外框綠同色系（D-160） */

/* 表格 */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:13px;color:var(--text2);font-weight:400;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line3);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl a.rowlink{text-decoration:none;color:var(--text);font-weight:500}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#FAF6F0}
.todo-row.click{cursor:pointer}.todo-row.click:hover{background:#FAF6F0}
.todo-row .rowlink{color:inherit;text-decoration:none}
.todo-row .age{font-size:14px;color:var(--text2);white-space:nowrap}
.distbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:3px;min-width:160px}
.distbar span{display:block}
/* 單戶頁可點的卡片與標題列：滑鼠移上去給陰影／底色（只用 CSS :hover，限有滑鼠的裝置，D-227） */
.rowcard{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;font-size:17px;font-weight:700;font-family:'Noto Serif TC',serif;min-height:56px;transition:box-shadow .15s,border-color .15s}
.rowhead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;min-height:36px;margin:-4px -8px;padding:4px 8px;width:calc(100% + 16px);border:none;background:none;border-radius:8px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.rowhead b,.rowhead h2{font-family:'Noto Serif TC',serif}
.rowcard:focus-visible,.rowhead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){.rowcard:hover{box-shadow:0 3px 10px rgba(80,60,40,.16);border-color:#CFC4B4}.rowhead:hover{background:var(--gray-s)}}
.o-docs{display:flex;flex-direction:column;gap:16px}
.allocrow{display:grid;grid-template-columns:7em 5.5em 6em;column-gap:12px;align-items:baseline;padding:2px 0}.allocrow>span:last-child{text-align:right}
/* 簽約資料：標籤｜數值｜操作 三欄固定，數值全部靠同一條線對齊 */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;column-gap:10px;align-items:center;min-height:40px;font-size:15px;border-bottom:1px solid var(--line3)}
.srow>.sl{color:var(--text2)}.srow>.sv{text-align:right;font-variant-numeric:tabular-nums}
.srow .lnk{height:32px;padding:0 4px;border:none;background:none;color:var(--accent-d);font-size:14px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;justify-self:end}
.snote{font-size:13px;color:var(--text2);text-align:right;padding:2px 62px 6px 0;border-bottom:1px solid var(--line3)}
.docchk.auto{cursor:default;color:var(--text2)}.docchk.auto input{cursor:default}

/* 按鈕 */
.btn{height:44px;padding:0 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.outline{background:var(--card);border-color:var(--accent);color:var(--accent-d)}
.btn.ghost{background:transparent;border-color:#DCD2C3;color:var(--ink2)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.docchk{cursor:pointer}.docchk input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;margin:0;cursor:pointer}
.btn:disabled,.btn:disabled:hover{background:#E3DCD1;border-color:#E3DCD1;color:#8A7F74;cursor:not-allowed}
.chipbtn{height:44px;padding:0 16px;border-radius:22px;border:1px solid #DCD2C3;background:var(--card);cursor:pointer;font-size:14px;color:var(--ink2)}
.chipbtn:disabled{background:#EFE9E0;color:#9A8F84;cursor:not-allowed;border-style:dashed}
.prog{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;align-items:center;gap:24px}
.acts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.vers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.vers .chipbtn{height:34px;padding:0 12px;font-size:13px}.vers .chipbtn.on{border-color:var(--accent);color:var(--accent-d);font-weight:500}
.actrow.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.actrow+.actrow{border-top:1px solid var(--line3);padding-top:10px}
.docbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctext{font-family:'Noto Serif TC',serif;font-size:16px;line-height:1.9;color:var(--text)}
.ctext .cttitle{text-align:center;font-size:22px;letter-spacing:.2em;margin:4px 0 14px}
.ctext h3{font-size:16px;margin:14px 0 2px}
.ctext p{margin:0 0 6px}
.ctext .ctsign{margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
.actchips{display:flex;flex-wrap:wrap;gap:8px}
.why{font-size:13px;color:var(--text2);display:flex;flex-direction:column;gap:4px}
.why b{color:var(--ink2);font-weight:500}

/* 單戶頁 */
.upage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:4px 0}
.kv>span:first-child{color:var(--text2)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.fact span{font-size:13px;color:var(--text2)}
.fact b{font-weight:500;font-variant-numeric:tabular-nums}
.h2s{font-size:18px;font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;color:var(--ink2)}
.steps i{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.steps .done i{background:var(--accent);color:#fff}
.steps .now i{border:2px solid var(--accent);color:var(--accent-d);background:var(--card)}
.steps .now{color:var(--accent-d);font-weight:700}
.steps .todo i{border:2px solid #CFC4B4;color:var(--text3)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:40px}
.check .ok{color:var(--accent)}
.warnbox{display:flex;gap:10px;background:var(--amber-s);border-radius:12px;padding:12px;font-size:15px;align-items:flex-start}
.warnbox>svg{color:var(--amber);flex-shrink:0;margin-top:2px}
.recs{display:flex;flex-direction:column}
.rec{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line3)}
.rec:last-child{border-bottom:none}

/* 清單列（手機與待辦清單） */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 14px;text-decoration:none;color:var(--text);border-bottom:1px solid var(--line3);min-height:56px}
.lrow:last-child{border-bottom:none}
.lmain{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.lmain b{font-weight:500;font-size:15px}
.lmain small{font-size:13px;color:var(--text2)}
.lrow .num{font-weight:700;font-size:17px}
.lrow>svg:last-child{color:#A39889;flex-shrink:0}
.todo-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line3);flex-wrap:wrap}
.todo-row:last-child{border-bottom:none}
.todo-row .lmain{min-width:200px}
.todo-row .acts{display:flex;gap:8px;flex-wrap:wrap}
.mscroll{overflow-y:auto;overscroll-behavior:contain}
.rule{font-size:14px;color:var(--text2);background:var(--gray-s);border-radius:10px;padding:10px 14px;margin-bottom:16px;line-height:1.6}

/* 分頁籤 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text2);border-bottom:3px solid transparent;white-space:nowrap;font-size:15px}
.tabs a[aria-current=page]{color:var(--accent-d);border-bottom-color:var(--accent);font-weight:700}
.filt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filt a{height:36px;padding:0 14px;border-radius:18px;border:1px solid #DCD2C3;background:var(--card);display:flex;align-items:center;text-decoration:none;color:var(--ink2);font-size:14px}
.filt a[aria-current=page]{background:var(--accent-s);border-color:var(--accent);color:var(--accent-d);font-weight:700}
.cfbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px}
.msel{position:relative}
.msel>summary{list-style:none;height:40px;padding:0 14px;border-radius:10px;border:1px solid #DCD2C3;background:var(--card);display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--ink2);max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msel>summary::-webkit-details-marker{display:none}
.msel.on>summary{background:var(--accent-s);border-color:var(--accent);color:var(--accent-d);font-weight:700}
.msel .mlist{position:absolute;z-index:20;top:44px;left:0;min-width:240px;max-height:320px;overflow:auto;background:var(--card);border:1px solid #DCD2C3;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px}
.msel .mlist a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--text);font-size:14px;white-space:nowrap}
.msel .mlist a:hover{background:var(--gray-s)}
.msel .mtool{position:sticky;top:-6px;z-index:1;background:var(--card);display:flex;gap:6px;padding:6px 4px 8px;margin:-6px -6px 4px;border-bottom:1px solid var(--line3)}
.msel .mtool input{flex:1;min-width:0;height:36px;padding:0 10px;border-radius:8px;border:1px solid #DCD2C3;background:var(--card);font-size:14px}
.msel .mtool .btn{height:36px;white-space:nowrap}
.msel .mnone{padding:8px 10px;font-size:13px;color:var(--text3)}

  var ph = '搜尋單元名稱（如 A9-8）、地址、稱呼或電話末碼';
  if (scoped) { var f = cfCur(); if (f.site.length || f.kase.length || f.st.length) ph = '在篩選結果 ' + cfList(f).length + ' 間中搜尋單元名稱、地址、稱呼…'; }
  return '<div class="sbox only-desk"><label class="sr" for="gq">搜尋</label>' + ic('search') + '<input id="gq" type="search" autocomplete="off" placeholder="' + ph + '" data-search="drop"' + (scoped ? ' data-scope="cf"' : '') + '><div class="sdrop" id="sdrop" hidden></div></div>';
}
/* 有上一個操作頁時，連結文字寫「上一頁」（實際去向不一定是上層頁面，D-232）；沒有時寫上層頁面名稱 */
function backLabel(back) { return navCanBack() ? '上一頁' : esc(back[1]); }
function mtop(back, nosearch) { return '<div class="mtop only-mob">' + (back ? '<a class="backlink" href="' + back[0] + '">' + ic('back', 22, 2) + backLabel(back) + '</a>' : '<span></span>') + '<span style="display:flex;align-items:center;gap:4px">' + (nosearch ? '' : '<a class="icon" href="#/search" aria-label="搜尋">' + ic('search', 22) + '</a>') + userBtn() + '</span></div>'; }
function head(title, sub, right, back, nosearch) {
  /* 使用者圖示放在頁首上方獨立一列（與返回連結同列），不與頁面功能按鈕同高（D-134） */
  return mtop(back, nosearch) + '<div class="ptop only-desk">' + (back ? '<a class="backlink" href="' + back[0] + '">' + ic('back', 20, 2) + backLabel(back) + '</a>' : '<span></span>') + userBtn() + '</div>' +
    '<header class="phead"><div><h1 class="serif">' + title + '</h1>' + (sub ? '<p class="muted">' + sub + '</p>' : '') + '</div><div class="phead-r">' + (right || '') + (nosearch ? '' : searchBox()) + '</div></header>';
}
function tabsNav(items, cur) { return '<nav class="tabs">' + items.map(function (x) { return '<a href="' + x[1] + '"' + (x[0] === cur ? ' aria-current="page"' : '') + '>' + x[2] + '</a>'; }).join('') + '</nav>'; }

/* ================= 首頁 ================= */
var SEVTXT = { red: '高優先', amber: '中優先', gray: '持續追蹤' };
function cardHtml(c) {
  return '<article class="card acard sev-' + c.sev + ' click" data-go="#/todo/' + c.key + '"><div class="acard-h"><h3>' + c.title + '<span class="sr">（' + SEVTXT[c.sev] + '）</span></h3>' + (c.admin ? '<span class="tag">限管理者</span>' : '') + '</div>' +
    '<div class="acount"><b>' + c.count + '</b><span>' + c.unit + '</span></div><p class="adetail">' + esc(c.headline) + '</p>' +
    '<a class="more" href="#/todo/' + c.key + '">查看全部' + ic('chev', 16, 2) + '</a></article>';
}
function tasksPanel() {
  var d = S.tasks.filter(function (t) { return t.done; }).length;
  return '<section class="card pad" aria-labelledby="task-h"><div class="task-h"><h2 class="serif" id="task-h">10 月例行作業</h2><div class="bar"><span style="width:' + Math.round(d / S.tasks.length * 100) + '%"></span></div><span class="muted small num">' + d + ' / ' + S.tasks.length + ' 完成</span></div>' +
    '<div class="grid3 tasks">' + S.tasks.map(function (t) {
      var go = t.done || !t.go ? '' : (t.go.charAt(0) === '#' ? '<a class="more" href="' + t.go + '">前往' + ic('chev', 14, 2) + '</a>' : '<button type="button" class="more" style="background:none;border:none;cursor:pointer;color:var(--accent-d);padding:0" data-act="' + t.go + '">前往' + ic('chev', 14, 2) + '</button>');
      return '<div style="display:flex;align-items:center;gap:8px"><label class="task" style="flex:1"><input type="checkbox" data-change="task" data-id="' + t.id + '"' + (t.done ? ' checked' : '') + '><span><b>' + esc(t.title) + '</b><small>' + esc(t.done ? (t.doneMeta || '已完成') : t.meta) + '</small></span></label>' + go + '</div>';
    }).join('') + '</div></section>';
}
/* 首頁＝功能卡片入口（D-131）：不顯示左側導覽與單元大搜尋欄；待辦事項與例行作業收進「待辦」卡片 */
function sevCounts() { var n = { red: 0, amber: 0, gray: 0 }; cards().forEach(function (c) { n[c.sev] += c.count; }); return n; }
function userBtn() {

  return '<div class="uwrap"><button type="button" class="uavatar ' + (adm ? 'ua-admin' : 'ua-staff') + '" data-act="umenu" aria-haspopup="true" aria-label="' + (adm ? '陳經理｜管理人員' : '小林｜一般人員') + '：開啟選單">' + ic(adm ? 'shield' : 'user', 24, 1.9) + '</button>' +
    '<div class="umenu" hidden><div class="umenu-h"><span class="uavatar ' + (adm ? 'ua-admin' : 'ua-staff') + '" style="width:36px;height:36px;cursor:default">' + ic(adm ? 'shield' : 'user', 20, 1.9) + '</span><span class="lmain"><b>' + (adm ? '陳經理' : '小林') + '</b><small>' + (adm ? '管理人員' : '一般人員') + '</small></span></div>' +
    (adm ? '<div class="umenu-t">管理</div>' + item('#/casecfg', 'building', '案件設定') + item('#/sitecfg', 'home', '案場設定') + item('#/company', 'file', '公司主檔') + item('#/lifecfg', 'book', '編輯設備年限表') +
      ['帳號管理', '資料匯入', '重建摘要'].map(function (x) { return btn('data-act="stub" data-stub="' + x + '"', 'gear', x); }).join('') : '') +
    '<div class="umenu-t">試用版</div>' + btn('data-act="role-swap"', 'status', '切換試用身分為' + (adm ? '一般人員' : '管理人員')) + btn('data-act="reset"', 'back', '重設試用資料') + btn('data-act="about"', 'alert', '關於試用版') +
    '<div class="umenu-sep"></div>' + btn('data-act="logout"', 'logout', '登出') + '</div></div>';
}
function pLogin() {
  return '<div style="max-width:420px;margin:60px auto 0"><section class="card pad col" style="align-items:stretch"><div class="brand" style="padding:0;justify-content:center"><span class="brand-mark">' + ic('home') + '</span><b>包租管理</b></div>' +
    '<p class="muted small" style="text-align:center">已登出。試用版不需輸入帳號密碼，選擇身分即可登入；正式版於此輸入帳號密碼（D-073）。</p>' +

/* 功能卡片：同尺寸；每張＝標題＋主數字＋2 行重點（D-131） */
function fcard(href, icon, title, big, unit, rows) {
  return '<a class="card fcard" href="' + href + '"><div class="fcard-h"><span class="badge b-gray" style="width:40px;height:40px;color:var(--accent-d)">' + ic(icon, 22) + '</span><h2 class="serif">' + title + '</h2>' + ic('chev', 18, 2) + '</div>' +
    '<div class="acount"><b>' + big + '</b><span>' + unit + '</span></div><div class="frows">' + rows.join('') + '</div></a>';
}
function frow(html) { return '<div class="frow">' + html + '</div>'; }
function pHome() {
  var n = sevCounts(); var tot = n.red + n.amber + n.gray; var td = S.tasks.filter(function (t) { return t.done; }).length;
  /* 契約（D-146） */
  var st = statsFor(S.cases.map(function (c) { return c.id; }));
  var exp30 = S.leases.filter(inRemind).length;
  var cCase = fcard('#/cases', 'building', '契約', S.units.length, '間出租單元', [
    frow(distbar(st.cnt)), frow(distTxt(st.cnt)),
    frow('<span class="muted">' + S.cases.length + ' 個案件｜提醒期內到期租約 ' + exp30 + ' 份</span>')]);
  /* 維修 */
  var mi = maintItems(); var old = mi[0];
  var doneM = S.maint.filter(function (m) { return isRepair(m) && !m.voided && m.doneDate && m.doneDate.slice(0, 7) === TODAY.slice(0, 7); }).length;
  var cMaint = fcard('#/maint', 'wrench', '維修', mi.length, '筆未結案', [
    frow(old ? '<span class="pill p-gray">最久</span> ' + esc(mName(old) + '｜' + old.item) + '｜報修日 ' + roc(old.reportDate) : '<span class="muted">沒有未結案的維修</span>'),
    frow('<span class="muted">10 月已完工 ' + doneM + ' 筆</span>')]);
  /* 帳務 */
  var oct = S.receivables.filter(function (r) { return r.month === '2026-10' && ['租約押金', '裝潢保證金', '押金差額補收'].indexOf(r.item) < 0; });
  var due = sum(oct, function (r) { return r.amount; }), paid = sum(oct, function (r) { return r.paid; }); var pct = due ? Math.round(paid / due * 100) : 0;
  var ar = arrearsItems(); var arAmt = sum(ar, function (a) { return a.amount; });
  var cBill = fcard('#/billing', 'wallet', '帳務', pct + '%', '10 月已收', [
    frow('<div class="bar" style="width:100%;height:8px"><span style="width:' + pct + '%"></span></div>'),
    frow('<span class="muted">尚未收 ' + money(due - paid) + '</span>'),
    frow(ar.length ? '<span class="pill p-amber">欠租 ' + ar.length + ' 戶</span> 逾期 ' + money(arAmt) : '<span class="muted">沒有逾期欠款</span>')]);
  /* 申報 */
  var fi = filingItems(); var urgent = fi.filter(function (x) { return x.left <= 7; }).length;
  var cFile = fcard('#/filings', 'file', '申報', fi.length, '筆待辦', [
    frow(urgent ? '<span class="pill p-red">7 天內到期 ' + urgent + ' 筆</span>' : '<span class="muted">7 天內沒有到期的申報</span>'),
    frow(fi.length ? '<span class="muted">最近期限 ' + roc(fi[0].dl) + '（' + esc(uName(fi[0].f.unitId)) + '）</span>' : '<span class="muted">全部已辦理</span>')]);
  /* 待辦 */
  var cTodo = fcard('#/todo', 'list', '待辦', tot, '件待處理', [
    frow('<span class="sevrow">' + [['red', '期限將到', 'red'], ['amber', '本月處理', 'amber'], ['gray', '持續追蹤', 'green']].map(function (x) { return '<span class="pill p-' + x[2] + '">' + x[1] + ' ' + n[x[0]] + '</span>'; }).join('') + '</span>'),
    frow('<span class="muted" style="white-space:nowrap">10 月例行作業</span><div class="bar" style="flex:1;max-width:140px"><span style="width:' + Math.round(td / S.tasks.length * 100) + '%"></span></div><span class="muted num">' + td + ' / ' + S.tasks.length + '</span>')]);
  /* 報表 */
  var vis = REPORTS.map(function (g) { return g[1].filter(function (r) { return !r[4] || isAdmin(); }).length; });
  var t5 = byId(S.tasks, 't5');
  var cRep = fcard('#/reports', 'chart', '報表', vis[0] + vis[1], '張報表與文件', [
    frow('<span class="muted">對外文件 ' + vis[0] + ' 張｜內部報表 ' + vis[1] + ' 張</span>'),
    frow(t5.done ? '<span class="pill p-ok">產權機關月報已送出</span>' : '<span class="pill p-amber">本月待送</span> 產權機關月報（' + esc(t5.meta) + '）')]);
  return '<header class="hometop"><div class="brand" style="padding:0"><span class="brand-mark">' + ic('home') + '</span><b>包租管理</b></div>' + userBtn() + '</header>' +
    '<div class="quick4 only-mob"><button type="button" data-act="quick" data-k="pay">' + ic('coin', 24) + '登錄收款</button><button type="button" data-act="quick" data-k="repair">' + ic('wrench', 24) + '報修</button><button type="button" data-act="quick" data-k="status">' + ic('status', 24) + '狀態回報</button><button type="button" data-act="quick" data-k="contact">' + ic('chat', 24) + '聯繫紀錄</button></div>' +
    '<div class="grid3 fcards">' + cCase + cMaint + cBill + cFile + cTodo + cRep + '</div>';
}
function pTodoHub() {
  var cs = cards(); var vis = cs.filter(function (c) { return c.count > 0; }); var hid = cs.filter(function (c) { return c.count === 0; });
  var total = sum(vis, function (c) { return c.count; });
  return head('待辦', '待處理事項 ' + total + ' 件｜' + rocW(TODAY), '', ['#/', '首頁']) +
    '<section class="sec" aria-labelledby="need-h"><div class="sec-h"><h2 class="serif" id="need-h">需要處理</h2></div>' +   /* 不放顏色圖例（D-160 第 5 點） */
    (vis.length ? '<div class="grid3 only-desk">' + vis.map(cardHtml).join('') + '</div>' +
      '<div class="sevlist only-mob">' + vis.map(function (c) { return '<a class="lrow sev-' + c.sev + '" href="#/todo/' + c.key + '"><span class="lmain"><b>' + c.title + '<span class="sr">（' + SEVTXT[c.sev] + '）</span></b><small>' + esc(c.headline) + '</small></span><span class="num">' + c.count + '</span>' + ic('chev', 18, 2) + '</a>'; }).join('') + '</div>' : '<div class="empty">目前無待處理事項</div>') +
    (hid.length ? '<p class="muted small">無待處理項目（已收合）：' + hid.map(function (c) { return c.title; }).join('、') + '</p>' : '') + '</section>' + tasksPanel();
}

/* ================= 待辦清單 ================= */
function pTodo(key) {
  var d = cardDef(key); if (!d) return notFound();
  if (d.admin && !isAdmin()) return head(d.title, '', '', ['#/todo', '待辦']) + '<div class="empty">本項限管理者檢視。</div>';
  var it = d.items(); var rows = '';
  if (key === 'filing') rows = it.map(filingRow).join('');
  if (key === 'refund') rows = it.map(function (x) { return '<div class="todo-row click" data-go="#/unit/' + x.s.unitId + '"><span class="lmain"><b><a class="rowlink" href="#/unit/' + x.s.unitId + '">' + uName(x.s.unitId) + '</a>｜' + esc(stLease(x.s).tenant) + '</b><small>退款期限 ' + roc(x.dl) + '（' + leftText(x.left) + '）｜應退 ' + money(stRefundTotal(x.s)) + '</small></span></div>'; }).join('');
  if (key === 'arrears') rows = it.map(arrearsRow).join('');
  if (key === 'deposit') rows = it.map(function (x) { return '<div class="todo-row click" data-go="#/unit/' + x.unitId + '"><span class="lmain"><b><a class="rowlink" href="#/unit/' + x.unitId + '">' + uName(x.unitId) + '</a>｜付訂人 ' + esc(x.payer) + '</b><small>訂金 ' + money(x.amount) + '｜保留至 ' + roc(x.holdUntil) + '（已過 ' + diff(x.holdUntil, TODAY) + ' 天）</small></span></div>'; }).join('');
  if (key === 'depref') rows = it.map(function (r) { var l = L(r.leaseId); return '<div class="todo-row click" data-go="#/unit/' + l.unitId + '"><span class="lmain"><b><a class="rowlink" href="#/unit/' + l.unitId + '">' + uName(l.unitId) + '</a>｜' + esc(l.tenant) + '</b><small>裝潢保證金 ' + money(r.amount) + '｜' + roc(r.created) + ' 起｜' + esc(r.why) + '｜<span class="pill ' + (r.acct ? 'p-gray' : 'p-amber') + '">' + depRefStatus(r) + '</span></small></span><div class="acts">' + (r.acct ? '<button class="btn sm outline" data-act="depref-done" data-id="' + r.id + '">登錄已退款</button>' : '<button class="btn sm outline" data-act="depref-acct" data-id="' + r.id + '">登錄退款帳戶</button>') + '</div></div>'; }).join('');
  if (key === 'notice') rows = it.map(noticeRow).join('');
  if (key === 'payable') rows = it.map(payableRow).join('');
  if (key === 'expiring') rows = it.map(function (l) { return '<div class="todo-row click" data-go="#/unit/' + l.unitId + '"><span class="lmain"><b><a class="rowlink" href="#/unit/' + l.unitId + '">' + uName(l.unitId) + '</a>｜' + esc(l.tenant) + '</b><small>租約迄日 ' + roc(l.end) + '（' + leftText(diff(TODAY, l.end)) + '）｜續約意向：' + l.renew + '</small></span><div class="acts"><button class="btn sm outline" data-act="renew" data-l="' + l.id + '">登錄續約意向</button></div></div>'; }).join('');
  if (key === 'maint') rows = it.map(maintRow).join('');
  if (key === 'master') rows = it.map(function (k) { return '<div class="todo-row"><span class="lmain"><b>' + C(k.caseId).name + '｜' + esc(k.name) + '</b><small>迄日 ' + roc(k.end) + '（剩 ' + diff(TODAY, k.end) + ' 天）｜出租方：' + esc(k.lessor) + '｜選擇權：' + esc(k.options) + '</small></span>' + (isAdmin() ? '<div class="acts"><a class="btn sm ghost" href="#/case/' + k.caseId + '">看合約</a></div>' : '') + '</div>'; }).join('');   /* 主約只有管理者看得到（D-146） */
  if (key === 'stale') rows = it.map(function (u) { return '<div class="todo-row click" data-go="#/unit/' + u.id + '"><span class="lmain"><b><a class="rowlink" href="#/unit/' + u.id + '">' + uName(u.id) + '</a></b><small>' + u.status + '，自 ' + roc(u.statusSince) + ' 起已 ' + diff(u.statusSince, TODAY) + ' 天未更新</small></span></div>'; }).join('');
  if (key === 'docs') rows = it.map(function (x) {
    var who = '<b><a class="rowlink" href="#/unit/' + x.l.unitId + '">' + uName(x.l.unitId) + '</a>｜' + esc(x.l.tenant) + '</b>';
    /* 每列右側統一一顆「勾選已完成」（D-230）：缺 1 項→確認視窗；缺多項→選擇視窗 */
    if (x.kind === '退租') return '<div class="todo-row click" data-go="#/unit/' + x.l.unitId + '"><span class="lmain">' + who + '<small>退租點交照片｜點交日 ' + roc(x.date) + '（已過 ' + diff(x.date, TODAY) + ' 天）</small></span><div class="acts"><button class="btn sm outline" data-act="doc-done" data-s="' + x.s.id + '">勾選已完成</button></div></div>';
    return '<div class="todo-row click" data-go="#/unit/' + x.l.unitId + '"><span class="lmain">' + who + '<small>缺 ' + x.miss.length + ' 項：' + x.miss.join('、') + '｜起租日 ' + roc(x.date) + '</small></span><div class="acts"><button class="btn sm outline" data-act="doc-done" data-l="' + x.l.id + '">勾選已完成</button></div></div>';
  }).join('');
  if (key === 'calendar') rows = it.map(function (x) { return '<div class="todo-row"><span class="lmain"><b>' + esc(x.hint) + '</b><small>' + roc(x.date) + '｜' + x.type + '｜' + esc(x.why) + '</small></span><div class="acts"><button class="btn sm outline" data-act="cal-assign" data-id="' + x.id + '">指定單元</button><button class="btn sm ghost" data-act="cal-ignore" data-id="' + x.id + '">不歸戶</button></div></div>'; }).join('');
  return head(d.title, it.length + ' ' + d.unit, key === 'calendar' ? '<button class="btn outline" data-act="cal-sync">' + ic('cal') + '同步日曆</button>' : '', ['#/todo', '待辦'], key === 'notice') + '<p class="rule">' + d.rule + '</p>' +
    (it.length ? '<div class="card">' + rows + '</div>' : '<div class="empty">目前無待處理事項</div>');
}
function filingRow(x) {

function arrearsRow(a) {

  if (k === 'site-basis') { var bsid = t.getAttribute('data-site'), bus = usite(bsid), bk = t.getAttribute('data-meter'), bv = t.value === 'room' ? 'room' : 'head'; if (!isAdmin() || !bus) { render(); toast('案場設定限管理者修改（D-073）'); return; } var bold = siteBasis(bsid)[bk]; S.siteCfg = S.siteCfg || {}; S.siteCfg[bsid] = S.siteCfg[bsid] || {}; S.siteCfg[bsid].basis = S.siteCfg[bsid].basis || {}; S.siteCfg[bsid].basis[bk] = bv; var bname = bk === 'water' ? '水費總表' : first(bus.meters, function (m) { return m.id === bk; }).name; if (bold !== bv) S.settingLog.push({ caseId: bus.caseId, date: TODAY, item: bus.name + ' ' + bname + '分攤基數', from: BASIS[bold], to: BASIS[bv], by: '管理者', why: '案場設定切換' }); save(); render(); toast(bus.name + ' ' + bname + '：改為' + BASIS[bv] + '（已產生應收的期次不受影響）'); return; }
  if (k === 'mf') {   /* 維修頁篩選：案場、上位契約、公區、只看作廢（D-223）；換案場時，已選的上位契約不在該案場就清掉 */
    var mk = t.getAttribute('data-k');
    if (mk === 'site') { MF.site = t.value; if (MF.kase && mfCaseOpts().every(function (c) { return c.id !== MF.kase; })) MF.kase = ''; }
    else if (mk === 'kase') MF.kase = t.value; else if (mk === 'pub') MF.pub = !!t.checked; else if (mk === 'voided') MF.voided = !!t.checked;
    render(); return;
  }
  if (k === 'site-hold') { var hsid = t.getAttribute('data-site'), hus = usite(hsid), hv = Number(t.value); if (!isAdmin() || !hus) { render(); toast('案場設定限管理者修改（D-073）'); return; } if (!(hv >= 0) || Math.round(hv) !== hv) { render(); toast('預扣額請填 0 以上的整數元'); return; } var hold0 = siteHold(hsid); S.siteCfg = S.siteCfg || {}; S.siteCfg[hsid] = S.siteCfg[hsid] || {}; S.siteCfg[hsid].hold = hv; if (hold0 !== hv) S.settingLog.push({ caseId: hus.caseId, date: TODAY, item: hus.name + ' 退租水電預扣額', from: num(hold0), to: num(hv), by: '管理者', why: '案場設定修改' }); save(); render(); toast(hus.name + '：退租水電預扣額改為 ' + money(hv) + '（已建立的結算不變）'); return; }
  if (k === 'site-laundry') { var sid = t.getAttribute('data-site'), us = usite(sid); if (!isAdmin() || !us) { render(); toast('案場設定限管理者修改（D-073）'); return; } var was = siteLaundry(sid); S.siteCfg = S.siteCfg || {}; S.siteCfg[sid] = S.siteCfg[sid] || {}; S.siteCfg[sid].laundry = !!t.checked; if (was !== !!t.checked) S.settingLog.push({ caseId: us.caseId, date: TODAY, item: us.name + ' 洗衣收入沖抵公電', from: was ? '有' : '無', to: t.checked ? '有' : '無', by: '管理者', why: '案場設定勾選' }); save(); render(); toast(us.name + (t.checked ? '：已啟用洗衣收入沖抵公電' : '：已停用洗衣收入沖抵公電')); return; }
  if (k === 'laundry-per') { var lpErr = laundrySetPeriod(t.getAttribute('data-id'), +t.getAttribute('data-floor'), t.value); if (!lpErr) save(); render(); if (lpErr) toast(lpErr); return; }
  if (k === 'task') { var x = byId(S.tasks, t.getAttribute('data-id')); x.done = t.checked; x.doneMeta = t.checked ? roc(TODAY).slice(4) + ' 完成' : ''; save(); render(); }
  if (k === 'doc') { var ld = L(t.getAttribute('data-l')); ld.docs[t.getAttribute('data-k')] = t.checked; save(); render(); if ($('#modal-root').innerHTML.indexOf('signmodal') >= 0) signModal(ld); var nm = missingDocs(ld).length; toast((t.checked ? '已登錄齊備' : '已取消勾選') + (nm ? '，尚缺 ' + nm + ' 項' : '，簽約資料全部齊備')); return; }
  if (k === 'st-name') { byId(S.settlements, t.getAttribute('data-s')).nameMatch = t.checked; save(); render(); }
  if (k === 'st-check') { byId(S.settlements, t.getAttribute('data-s')).checks[t.getAttribute('data-k')] = t.checked; save(); render(); }
  if (k === 'life') { try { lifeSet(+t.getAttribute('data-i'), t.getAttribute('data-f'), t.type === 'checkbox' ? t.checked : t.value); save(); render(); } catch (err) { toast(String(err)); } return; }
  if (k === 'vac') { var vk = t.getAttribute('data-k'); if (vk === 'from') S.vacFrom = t.value; else S.vacTo = t.value; var f0 = S.vacFrom || TODAY.slice(0, 7), t0 = S.vacTo || TODAY.slice(0, 7); if (f0 > t0) { if (vk === 'from') S.vacTo = f0; else S.vacFrom = t0; } save(); render(); return; }
  if (k === 'rate') { var v = Number(t.value); if (v > 0 && v < 20) { S.rate = v; save(); render(); } else toast('利率請填 0～20 之間的數字'); }
});
document.addEventListener('input', function (e) {
  var t = e.target; if (!t.getAttribute) return;
  if (t.hasAttribute('data-search')) { renderSearch(t); return; }
  if (t.hasAttribute('data-os-end')) {   /* 退租點交：起算日沒手改過就跟著點交日重算預設，並更新算式（D-185） */
    var fm = t.form; var fd = fm.querySelector('[name=date]'), fo = fm.querySelector('[name=os]');
    if (t.name === 'os') fo.setAttribute('data-touched', '1');
    var dd = parseRoc(fd.value); if (t.name === 'date' && dd && !fo.hasAttribute('data-touched')) { var od = overstayDefault(t.getAttribute('data-os-end'), dd); fo.value = od ? roc(od) : ''; }
    var raw = String(fo.value || '').trim(), so = raw ? parseRoc(raw) : '';
    var nb = fm.querySelector('#osNote'); if (nb) nb.textContent = !dd ? '點交日格式不對。' : raw && !so ? '起算日格式不對，請輸入像 115/12/01 的日期。' : overstayNote(+t.getAttribute('data-os-rent'), so, so ? dd : '');
    return;
  }
  var cq = t.getAttribute('data-cfq');
  if (cq) {
    CF_Q[cq] = t.value; var box = t.closest('.mlist'); var n = 0;
    box.querySelectorAll('a[data-act="cf"]').forEach(function (a) { var m = cfMatch(a.getAttribute('data-label'), t.value); a.hidden = !m; if (m) n++; });
    var bt = box.querySelector('[data-act="cf-all"]'); bt.textContent = cfAllLabel(cq); bt.disabled = !n;
    box.querySelector('.mnone').hidden = !!n; return;
  }
  var pk = t.getAttribute('data-pair');
  if (pk) { S.pair = S.pair || JSON.parse(JSON.stringify(PAIR0)); if (pk === 'absorb') S.pair.absorb = t.value === 'A' ? 'A' : 'B'; else if (pk === 'aTo' || pk === 'bTo') { var pd = parseRoc(t.value); if (!pd) return; S.pair[pk] = pd; } else { var pv = Number(t.value); if (isNaN(pv) || pv < 0 || (pk === 'ra' && pv > 100)) return; S.pair[pk] = Math.round(pv); } save(); var pb = $('#pairBox'); if (pb) pb.innerHTML = pairBody(); return; }
  var uk = t.getAttribute('data-util'), rm = t.getAttribute('data-util-meter'), me = t.getAttribute('data-util-elec');
  if (uk || rm || me) {
    var v = Number(t.value); if (isNaN(v) || v < 0) return; var ek = t.getAttribute('data-k') || 'bill';
    if (uk) { if ((uk === 'billDeg') && v <= 0) return; S.util[uk] = v; } else if (me) { if (ek === 'price' && v <= 0) return; S.util.elec[me][ek] = v; } else S.util.meters[rm][+t.getAttribute('data-i')][t.getAttribute('data-f')] = v;
    save(); var box = $('#utilBody'); if (!box) return;
    var sel = uk ? '[data-util="' + uk + '"]' : me ? '[data-util-elec="' + me + '"][data-k="' + ek + '"]' : '[data-util-meter="' + rm + '"][data-i="' + t.getAttribute('data-i') + '"][data-f="' + t.getAttribute('data-f') + '"]';
    var had = document.activeElement === t; box.innerHTML = utilBody();
    if (had) { var el = document.querySelector(sel); if (el) { el.focus(); var n = el.value.length; el.setSelectionRange && el.setSelectionRange(n, n); } }
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if ($('#pop-root').innerHTML) closePop(); else if ($('#modal-root').innerHTML) closeModal(); var sd = $('#sdrop'); if (sd) sd.hidden = true; }
  var sm = e.key === 'Enter' && e.target.getAttribute ? e.target.getAttribute('data-search') : null;
  if (sm === 'pick') { var a = document.querySelector('#pres a, #pres button'); e.preventDefault(); if (a) a.click(); }
  else if (sm) { var rs = searchUnits(e.target.value, searchPool(e.target)); if (rs.length) { e.preventDefault(); location.hash = '#/unit/' + rs[0].id; } }
});

/* ================= 主程式 ================= */
function render() {
  if (releaseFilings()) save();
  var p = route(); var page = p[0] || 'home'; var html;
  switch (page) {
    case 'home': html = pHome(); break;
    case 'todo': html = p[1] ? pTodo(p[1]) : pTodoHub(); break;
    case 'cases': html = pCases(); break;
    case 'case': html = pCase(p[1], p[2]); break;
    case 'unit': html = pUnit(p[1]); break;
    case 'billing': html = pBilling(p[1] || 'open'); break;
    case 'utility': html = pUtility(p[1]); break;
    case 'maint': html = pMaint(); break;
    case 'ref': html = pDepr(); break;
    case 'filings': html = pFilings(p[1]); break;
    case 'reports': html = pReports(); break;
    case 'report': html = pReport(p[1]); break;
    case 'casecfg': html = pCaseCfg(); break;
    case 'sitecfg': html = pSiteCfg(); break;
    case 'company': html = pCompany(); break;
    case 'lifecfg': html = pLifeCfg(); break;
    case 'more': html = pMore(); break;
    case 'search': html = pSearch(); break;
    default: html = pHome();
  }
  if (S.loggedOut) { page = 'login'; html = pLogin(); }
  if (document.body && document.body.classList) document.body.classList.toggle('nonav', page === 'home' || page === 'login');
  $('#side').innerHTML = sideNav(page); $('#main').innerHTML = html; $('#tabbar').innerHTML = tabbar(page); fitMaint();
}
/* 維修總表固定顯示 10 列高度、其他費用 5 列高度，超過用捲動；列高不一，所以量第 N 列的底緣（N 筆以內不限高） */
function fitMaint() {
  document.querySelectorAll('.mscroll').forEach(function (b) {
    b.style.maxHeight = ''; var n = +b.getAttribute('data-rows') || 10; var r = b.children; if (r.length <= n) return;
    b.style.maxHeight = (r[n - 1].offsetTop + r[n - 1].offsetHeight - r[0].offsetTop) + 'px';
  });
}
window.addEventListener('resize', fitMaint);
/* 「上一頁」＝回到上一個操作的頁面，不是功能的上層頁面（D-232）。NAV＝本次開啟後走過的頁面；
   頁面上的上一頁連結本身仍寫上層頁面，作為沒有上一個頁面時（直接開啟網址）的備案 */
var NAV = [];
function navTrack(h) { if (NAV.length >= 2 && NAV[NAV.length - 2] === h) NAV.pop(); else if (NAV[NAV.length - 1] !== h) NAV.push(h); }
function navCanBack() { return NAV.length >= 2; }
window.addEventListener('hashchange', function () {
  navTrack(location.hash);
  closeModal(); closePop(); CF_OPEN = null; CF_Q = {}; SIGN_FOLD = {}; render(); window.scrollTo(0, 0);
  var p = route();
  if (p[0] === 'unit' && p[2]) {
    var u = U(p[1]); var l = u ? activeLease(u.id) : null; history.replaceState(null, '', '#/unit/' + p[1]); NAV[NAV.length - 1] = '#/unit/' + p[1];
    if (u && (p[2] === 'repair' || p[2] === 'expense' || ((p[2] === 'pay' || p[2] === 'contact') && l))) openAction(p[2], { u: u.id, l: l ? l.id : '' });
  }
  if (p[0] === 'search') { var q = $('#mq'); if (q) q.focus(); }
});
NAV = [location.hash || '#/'];
load(); render();
</script>
